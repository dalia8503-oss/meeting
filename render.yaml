# Render Blueprint (무료 플랜): 백엔드(FastAPI). 프런트엔드는 Vercel(frontend/)에 배포한다.
# 무료 플랜은 영구 디스크가 없어 재시작·재배포 때 저장된 회의 데이터가 사라지고, 15분간 요청이 없으면 서버가 잠든다.
# 영구 저장이 필요하면 plan을 starter로 올리고 disk(mountPath: /data)를 추가한다.
services:
  - type: web
    name: meeting-action-agent-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MAA_MODE
        value: live
      - key: MAA_RUNTIME_DIR
        value: /tmp/maa
      - key: GEMINI_API_KEY
        sync: false           # 대시보드에서 직접 입력 (저장소에 올리지 않는다)
      - key: MAA_CORS_ORIGINS
        sync: false           # 예: https://<프로젝트>.vercel.app
