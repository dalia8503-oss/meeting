# Render Blueprint: 백엔드(FastAPI). 프런트엔드는 Vercel(frontend/)에 배포한다.
services:
  - type: web
    name: meeting-action-agent-api
    runtime: docker
    plan: starter            # 디스크(영구 저장)는 유료 플랜에서만 쓸 수 있다
    healthCheckPath: /api/health
    disk:
      name: maa-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: MAA_MODE
        value: live
      - key: MAA_RUNTIME_DIR
        value: /data
      - key: GEMINI_API_KEY
        sync: false           # 대시보드에서 직접 입력 (저장소에 올리지 않는다)
      - key: MAA_CORS_ORIGINS
        sync: false           # 예: https://<프로젝트>.vercel.app
